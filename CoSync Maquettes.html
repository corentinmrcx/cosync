<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoSync — Maquettes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f3f4f6; color: #374151; }
    button, select, input { font-family: 'Inter', sans-serif; }
    select { -webkit-appearance: none; appearance: none; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── Design tokens ─────────────────────────────────────────── */
const RED   = '#ff3131';
const DARK  = '#1f1f1f';
const GRAY  = '#374151';
const MID   = '#6b7280';
const LIGHT = '#f9fafb';
const BORD  = '#e5e7eb';

/* ── SVG icons (large, for hub cards) ─────────────────────── */
const IcoUsers = () => (
  <svg width="72" height="72" viewBox="0 0 24 24" fill={DARK}>
    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
  </svg>
);
const IcoBox = () => (
  <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke={DARK} strokeWidth="1.35" strokeLinecap="round" strokeLinejoin="round">
    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
    <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
    <line x1="12" y1="22.08" x2="12" y2="12"/>
  </svg>
);
const IcoImport = () => (
  <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke={DARK} strokeWidth="1.35" strokeLinecap="round" strokeLinejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="3"/>
    <polyline points="8 12 12 16 16 12"/>
    <line x1="12" y1="8" x2="12" y2="16"/>
  </svg>
);
const IcoWallet = () => (
  <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke={DARK} strokeWidth="1.35" strokeLinecap="round" strokeLinejoin="round">
    <rect x="2" y="5" width="20" height="14" rx="2"/>
    <path d="M16 13a1 1 0 1 0 2 0 1 1 0 0 0-2 0"/>
    <line x1="2" y1="10" x2="22" y2="10"/>
  </svg>
);
const IcoGear = () => (
  <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke={DARK} strokeWidth="1.35" strokeLinecap="round" strokeLinejoin="round">
    <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </svg>
);

/* ── Small utility icons ───────────────────────────────────── */
const Chevron = ({ sz = 12 }) => (
  <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
    <polyline points="6 9 12 15 18 9"/>
  </svg>
);
const UserSm = ({ sz = 18, col = 'currentColor' }) => (
  <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke={col} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
  </svg>
);
const CheckSm = ({ sz = 17, col = '#16a34a' }) => (
  <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke={col} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
    <polyline points="20 6 9 17 4 12"/>
  </svg>
);
const ClockSm = ({ sz = 17 }) => (
  <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="#d97706" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
  </svg>
);
const ArrowR = ({ sz = 17, col = 'white' }) => (
  <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke={col} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
    <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
  </svg>
);
const CardIco = ({ sz = 15, col = 'white' }) => (
  <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke={col} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>
  </svg>
);
const XlsIco = ({ sz = 15, col = 'white' }) => (
  <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke={col} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="7 10 12 15 17 10"/>
    <line x1="12" y1="15" x2="12" y2="3"/>
  </svg>
);

/* ══════════════════════════════════════════════════════════════
   SHARED — red AppHeader with season dropdown
═══════════════════════════════════════════════════════════════ */
function AppHeader({ season, setSeason, showSelector = false }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const seasons = ['2025/26', '2024/25', '2023/24', '2022/23'];

  useEffect(() => {
    const h = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);

  return (
    <header style={{ background: RED, color: 'white', height: 64, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 30px', position: 'relative', zIndex: 30 }}>
      <span style={{ fontWeight: 900, fontSize: 20, letterSpacing: 2 }}>CoSync</span>

      {showSelector ? (
        <div ref={ref} style={{ position: 'relative' }}>
          <button onClick={() => setOpen(o => !o)}
            style={{ background: 'rgba(255,255,255,.18)', border: '2px solid rgba(255,255,255,.42)', color: 'white', padding: '8px 20px', borderRadius: 6, fontWeight: 800, fontSize: 13, letterSpacing: .8, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 10 }}>
            SAISON {season}
            <Chevron sz={13} />
          </button>
          {open && (
            <div style={{ position: 'absolute', top: 52, left: '50%', transform: 'translateX(-50%)', background: 'white', border: '1.5px solid #e0e0e0', borderRadius: 9, minWidth: 192, overflow: 'hidden', boxShadow: '0 10px 32px rgba(0,0,0,.14)' }}>
              {seasons.filter(s => s !== season).map(s => (
                <div key={s}
                  onClick={() => { setSeason(s); setOpen(false); }}
                  onMouseEnter={e => e.currentTarget.style.background = '#fef2f2'}
                  onMouseLeave={e => e.currentTarget.style.background = 'white'}
                  style={{ padding: '13px 24px', color: DARK, fontWeight: 700, fontSize: 14, cursor: 'pointer' }}>
                  Saison {s}
                </div>
              ))}
            </div>
          )}
        </div>
      ) : (
        <span style={{ fontWeight: 700, fontSize: 13, letterSpacing: .8, color: 'rgba(255,255,255,.82)' }}>
          SAISON {season}
        </span>
      )}

      <div style={{ width: 38, height: 38, borderRadius: '50%', background: 'rgba(255,255,255,.18)', border: '2px solid rgba(255,255,255,.42)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <UserSm sz={18} col="white" />
      </div>
    </header>
  );
}

/* ══════════════════════════════════════════════════════════════
   SCREEN 1 — Hub Admin
═══════════════════════════════════════════════════════════════ */
const HUB_CARDS = [
  { label: 'Licenciés',     icon: <IcoUsers />, sub: '127 inscrits' },
  { label: 'Stocks',        icon: <IcoBox />,   sub: '8 articles suivis' },
  { label: 'Import',        icon: <IcoImport />,sub: 'Dernière import. : hier' },
  { label: 'Finance',       icon: <IcoWallet />,sub: '3 400 € collectés' },
  { label: 'Configuration', icon: <IcoGear />,  sub: 'Saison 2025/26 active' },
];

function HubCard({ card }) {
  const [hov, setHov] = useState(false);
  return (
    <div
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      style={{ border: `2.5px solid ${RED}`, borderRadius: 14, padding: '38px 24px 30px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14, cursor: 'pointer', background: hov ? '#fff5f5' : 'white', transition: 'background .15s, box-shadow .15s', boxShadow: hov ? '0 6px 24px rgba(255,49,49,.14)' : '0 2px 8px rgba(0,0,0,.04)' }}>
      {card.icon}
      <span style={{ fontWeight: 800, fontSize: 20, color: DARK, marginTop: 4 }}>{card.label}</span>
      <span style={{ fontSize: 12, color: MID }}>{card.sub}</span>
    </div>
  );
}

function HubAdmin({ season, setSeason }) {
  return (
    <div style={{ minHeight: 'calc(100vh - 52px)', background: 'white', display: 'flex', flexDirection: 'column' }}>
      <AppHeader season={season} setSeason={setSeason} showSelector />
      <div style={{ padding: '48px 40px 40px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 24, flex: 1 }}>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 24, width: '100%', maxWidth: 900 }}>
          {HUB_CARDS.slice(0, 3).map(c => <HubCard key={c.label} card={c} />)}
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2,1fr)', gap: 24, width: 600 }}>
          {HUB_CARDS.slice(3).map(c => <HubCard key={c.label} card={c} />)}
        </div>
      </div>
      {/* Club footer */}
      <div style={{ padding: '28px 40px 36px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8, borderTop: `1px solid ${BORD}` }}>
        <img src="uploads/logo.png" alt="Foyer de Soudron" style={{ height: 76, objectFit: 'contain', opacity: .92 }} />
        <span style={{ fontSize: 14, fontWeight: 700, color: DARK, marginTop: 4 }}>Foyer de Soudron</span>
        <span style={{ fontSize: 12, color: MID }}>Saison {season}</span>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   SCREEN 2 — Liste Licenciés
═══════════════════════════════════════════════════════════════ */
const ROWS = [
  { nom: 'Dupont Martin',  cat: 'Senior',   eq: 'A', st: 'valide' },
  { nom: 'Bernard Julien', cat: 'U17',      eq: 'B', st: 'form'   },
  { nom: 'Moreau Thomas',  cat: 'Senior',   eq: 'A', st: 'lien'   },
  { nom: 'Laurent Pierre', cat: 'U15',      eq: 'C', st: 'valide' },
  { nom: 'Simon Antoine',  cat: 'U17',      eq: 'B', st: 'lien'   },
  { nom: 'Faure Léa',      cat: 'Senior F', eq: 'F', st: 'form'   },
  { nom: 'Garcia Lucas',   cat: 'Senior',   eq: 'A', st: 'valide' },
  { nom: 'Petit Chloé',    cat: 'U15',      eq: 'C', st: 'lien'   },
];

const ST = {
  lien:   { label: 'Lien envoyé',         color: '#1d4ed8', bg: '#eff6ff', dot: '#3b82f6' },
  form:   { label: 'Formulaire complété', color: '#92400e', bg: '#fffbeb', dot: '#f59e0b' },
  valide: { label: 'Validé',              color: '#166534', bg: '#f0fdf4', dot: '#22c55e' },
};

function Badge({ st }) {
  const s = ST[st];
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '4px 11px', borderRadius: 99, fontSize: 12, fontWeight: 600, color: s.color, background: s.bg }}>
      <span style={{ width: 7, height: 7, borderRadius: '50%', background: s.dot, flexShrink: 0 }}></span>
      {s.label}
    </span>
  );
}

const SearchIco = () => (
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
  </svg>
);
const BackIco = () => (
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
    <polyline points="15 18 9 12 15 6"/>
  </svg>
);

function ListeLicencies({ season, setSeason, onBack }) {
  const [search, setSearch] = useState('');
  const [filterOpen, setFilterOpen] = useState(false);
  const [filtres, setFiltres] = useState({ cat: 'Tous', eq: 'Tous', st: 'Tous' });
  const fRef = useRef(null);
  const searchRef = useRef(null);

  useEffect(() => {
    const h = e => { if (fRef.current && !fRef.current.contains(e.target)) setFilterOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);

  const set = (k, v) => setFiltres(p => ({ ...p, [k]: v }));
  const rows = ROWS.filter(r =>
    (filtres.cat === 'Tous' || r.cat === filtres.cat) &&
    (filtres.eq  === 'Tous' || r.eq  === filtres.eq)  &&
    (filtres.st  === 'Tous' || r.st  === filtres.st)  &&
    (search === '' || r.nom.toLowerCase().includes(search.toLowerCase()))
  );

  const filterDefs = [
    { k: 'cat', label: 'Catégorie', opts: [['Tous','Tous'],['Senior','Senior'],['Senior F','Senior F'],['U17','U17'],['U15','U15']] },
    { k: 'eq',  label: 'Équipe',    opts: [['Tous','Tous'],['A','A'],['B','B'],['C','C'],['F','F']] },
    { k: 'st',  label: 'Statut',    opts: [['Tous','Tous'],['lien','Lien envoyé'],['form','Formulaire complété'],['valide','Validé']] },
  ];

  return (
    <div style={{ minHeight: 'calc(100vh - 52px)', background: 'white' }}>
      {/* Même header rouge que le dashboard */}
      <AppHeader season={season} showSelector={false} />

      {/* Sous-nav avec retour */}
      <div style={{ background: LIGHT, borderBottom: `1px solid ${BORD}`, padding: '10px 28px', display: 'flex', alignItems: 'center', gap: 10 }}>
        <button onClick={onBack}
          style={{ background: 'none', border: 'none', color: MID, fontSize: 13, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 5, padding: '4px 8px', borderRadius: 5, fontWeight: 500 }}
          onMouseEnter={e => { e.currentTarget.style.background = BORD; e.currentTarget.style.color = DARK; }}
          onMouseLeave={e => { e.currentTarget.style.background = 'none'; e.currentTarget.style.color = MID; }}>
          <BackIco /> Tableau de bord
        </button>
        <span style={{ color: BORD, fontSize: 16 }}>›</span>
        <span style={{ fontWeight: 700, fontSize: 13, color: DARK }}>Licenciés</span>
      </div>

      <div style={{ padding: '24px 32px' }}>
        {/* Bloc filtre : recherche + actions */}
        <div style={{ background: LIGHT, border: `1px solid ${BORD}`, borderRadius: 10, padding: '18px 20px', marginBottom: 20 }}>
        <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 12 }}>
          <div style={{ position: 'relative', width: '100%', maxWidth: 520 }}>
            <span style={{ position: 'absolute', left: 14, top: '50%', transform: 'translateY(-50%)', pointerEvents: 'none', display: 'flex' }}>
              <SearchIco />
            </span>
            <input
              ref={searchRef}
              type="text"
              placeholder="Rechercher un licencié…"
              value={search}
              onChange={e => setSearch(e.target.value)}
              style={{ width: '100%', padding: '11px 14px 11px 42px', border: `1.5px solid ${BORD}`, borderRadius: 8, fontSize: 14, color: DARK, outline: 'none', transition: 'border-color .2s' }}
              onFocus={e => e.target.style.borderColor = RED}
              onBlur={e => e.target.style.borderColor = BORD}
            />
          </div>
        </div>

        {/* Toolbar */}
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 12 }}>
          <div ref={fRef} style={{ position: 'relative' }}>
            <button onClick={() => setFilterOpen(o => !o)}
              style={{ border: `2px solid ${DARK}`, background: filterOpen ? DARK : 'white', color: filterOpen ? 'white' : DARK, padding: '8px 16px', borderRadius: 6, fontWeight: 600, fontSize: 13, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 7, transition: 'background .15s, color .15s' }}>
              Filtres <Chevron sz={12} />
            </button>
            {filterOpen && (
              <div style={{ position: 'absolute', top: 46, left: 0, background: 'white', border: `1.5px solid ${BORD}`, borderRadius: 10, padding: '18px 18px 14px', minWidth: 256, boxShadow: '0 8px 24px rgba(0,0,0,.1)', zIndex: 20 }}>
                <p style={{ fontSize: 10, fontWeight: 800, color: MID, textTransform: 'uppercase', letterSpacing: .8, marginBottom: 14 }}>Filtrer par</p>
                {filterDefs.map(f => (
                  <div key={f.k} style={{ marginBottom: 13 }}>
                    <label style={{ fontSize: 11, fontWeight: 700, color: GRAY, display: 'block', marginBottom: 5 }}>{f.label}</label>
                    <div style={{ position: 'relative' }}>
                      <select value={filtres[f.k]} onChange={e => set(f.k, e.target.value)}
                        style={{ width: '100%', padding: '8px 32px 8px 10px', border: `1.5px solid ${BORD}`, borderRadius: 6, fontSize: 13, color: DARK, background: 'white', cursor: 'pointer' }}>
                        {f.opts.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                      </select>
                      <span style={{ position: 'absolute', right: 10, top: '50%', transform: 'translateY(-50%)', pointerEvents: 'none', color: MID }}>
                        <Chevron sz={12} />
                      </span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
          <button style={{ background: RED, color: 'white', border: 'none', padding: '8px 20px', borderRadius: 6, fontWeight: 700, fontSize: 13, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 8 }}>
            <XlsIco /> Importer XLSX
          </button>
        </div>
        </div>

        {/* Tableau */}
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 14 }}>
          <thead>
            <tr style={{ borderBottom: `2.5px solid ${RED}` }}>
              {['Nom / Prénom', 'Catégorie', 'Équipe', 'Statut'].map(h => (
                <th key={h} style={{ textAlign: 'left', padding: '10px 16px', fontWeight: 700, fontSize: 11, textTransform: 'uppercase', letterSpacing: .6, color: DARK }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map((r, i) => (
              <tr key={i}
                style={{ borderBottom: `1px solid ${BORD}`, cursor: 'pointer' }}
                onMouseEnter={e => e.currentTarget.style.background = '#fff8f8'}
                onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                <td style={{ padding: '13px 16px', fontWeight: 500, color: DARK }}>{r.nom}</td>
                <td style={{ padding: '13px 16px', color: GRAY }}>{r.cat}</td>
                <td style={{ padding: '13px 16px', color: GRAY }}>Équipe {r.eq}</td>
                <td style={{ padding: '13px 16px' }}><Badge st={r.st} /></td>
              </tr>
            ))}
          </tbody>
        </table>

        {/* Compteur sous le tableau, centré */}
        <p style={{ textAlign: 'center', marginTop: 18, color: MID, fontSize: 13 }}>
          {rows.length} résultat{rows.length > 1 ? 's' : ''} sur {ROWS.length}
        </p>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   SCREEN 3 — Formulaire public (mobile-first)
═══════════════════════════════════════════════════════════════ */
function FormulairePublic() {
  const [vals, setVals] = useState({ haut: '', bas: '', pointure: '' });
  const set = (k, v) => setVals(p => ({ ...p, [k]: v }));
  const STEP = 2; const TOTAL = 5;

  const fields = [
    { k: 'haut',     label: 'Taille haut', opts: ['XS','S','M','L','XL','XXL'] },
    { k: 'bas',      label: 'Taille bas',  opts: ['XS','S','M','L','XL','XXL'] },
    { k: 'pointure', label: 'Pointure',    opts: Array.from({length:15},(_,i)=>String(36+i)) },
  ];

  return (
    <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'flex-start', padding: '36px 20px', background: '#ebebeb', minHeight: 'calc(100vh - 52px)' }}>
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12 }}>
        <p style={{ fontSize: 10, color: '#aaa', fontWeight: 700, textTransform: 'uppercase', letterSpacing: 1.2 }}>Aperçu smartphone · 390 px</p>

        {/* Phone shell */}
        <div style={{ width: 390, borderRadius: 48, border: '10px solid #111', background: 'white', overflow: 'hidden', display: 'flex', flexDirection: 'column', boxShadow: '12px 12px 0 rgba(0,0,0,.15)', minHeight: 730 }}>

          {/* Notch */}
          <div style={{ background: '#111', height: 44, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
            <div style={{ width: 88, height: 22, background: '#0a0a0a', borderRadius: 11 }}></div>
          </div>

          {/* Club band */}
          <div style={{ background: RED, padding: '11px 20px', display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0 }}>
            <div style={{ width: 30, height: 30, borderRadius: '50%', background: 'rgba(255,255,255,.24)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 15, flexShrink: 0 }}>⚽</div>
            <span style={{ color: 'white', fontWeight: 700, fontSize: 14 }}>Foyer de Soudron</span>
          </div>

          {/* Progress */}
          <div style={{ padding: '14px 20px 12px', background: '#fafafa', borderBottom: `1px solid ${BORD}`, flexShrink: 0 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 9 }}>
              <span style={{ fontSize: 12, color: GRAY, fontWeight: 500 }}>Étape {STEP} sur {TOTAL}</span>
              <span style={{ fontSize: 12, fontWeight: 700, color: RED }}>{Math.round(STEP/TOTAL*100)}%</span>
            </div>
            <div style={{ display: 'flex', gap: 5 }}>
              {Array.from({length: TOTAL}).map((_, i) => (
                <div key={i} style={{ flex: 1, height: 5, borderRadius: 99, background: i < STEP ? RED : BORD }}></div>
              ))}
            </div>
          </div>

          {/* Body */}
          <div style={{ padding: '24px 20px 14px', flex: 1, overflowY: 'auto' }}>
            <h2 style={{ fontSize: 23, fontWeight: 800, color: DARK, marginBottom: 5 }}>Équipement</h2>
            <p style={{ fontSize: 13, color: GRAY, lineHeight: 1.55, marginBottom: 28 }}>Renseignez vos tailles pour préparer votre kit de la saison.</p>
            {fields.map(f => (
              <div key={f.k} style={{ marginBottom: 20 }}>
                <label style={{ fontSize: 13, fontWeight: 600, color: DARK, display: 'block', marginBottom: 7 }}>{f.label}</label>
                <div style={{ position: 'relative' }}>
                  <select value={vals[f.k]} onChange={e => set(f.k, e.target.value)}
                    style={{ width: '100%', padding: '13px 40px 13px 14px', border: `2px solid ${vals[f.k] ? RED : BORD}`, borderRadius: 9, fontSize: 15, color: vals[f.k] ? DARK : '#aaa', background: 'white', cursor: 'pointer', transition: 'border-color .2s' }}>
                    <option value="">Sélectionner…</option>
                    {f.opts.map(o => <option key={o} value={o}>{o}</option>)}
                  </select>
                  <span style={{ position: 'absolute', right: 13, top: '50%', transform: 'translateY(-50%)', pointerEvents: 'none', color: MID }}>
                    <Chevron sz={16} />
                  </span>
                </div>
              </div>
            ))}
          </div>

          {/* Fixed CTA */}
          <div style={{ padding: '14px 20px 22px', borderTop: `1px solid ${BORD}`, background: 'white', flexShrink: 0 }}>
            <button style={{ width: '100%', background: RED, color: 'white', border: 'none', padding: '15px', borderRadius: 10, fontSize: 16, fontWeight: 800, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10 }}>
              Suivant <ArrowR sz={18} />
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   SCREEN 4 — Fiche licencié
═══════════════════════════════════════════════════════════════ */
function FicheLicencie({ season, onBackDashboard, onBackList }) {
  const [paid, setPaid] = useState(false);

  const dossier = [
    { label: 'Formulaire signé',    done: true  },
    { label: 'Certificat médical',  done: true  },
    { label: "Photo d'identité",    done: false },
    { label: 'Paiement cotisation', done: paid  },
  ];

  const history = [
    { date: '15 mai 2026',         action: "Lien d'inscription envoyé par email", who: 'Admin' },
    { date: '16 mai, 09:14',       action: 'Formulaire complété par le licencié',  who: 'Système' },
    { date: '16 mai, 10:31',       action: 'Certificat médical uploadé',           who: 'Dupont M.' },
    ...(paid ? [{ date: '16 mai, 11:02', action: 'Paiement confirmé manuellement', who: 'Admin' }] : []),
  ];

  return (
    <div style={{ minHeight: 'calc(100vh - 52px)', background: LIGHT }}>
      <AppHeader season={season} showSelector={false} />
      {/* Breadcrumb sous-nav */}
      <div style={{ background: LIGHT, borderBottom: `1px solid ${BORD}`, padding: '10px 28px', display: 'flex', alignItems: 'center', gap: 10 }}>
        <button onClick={onBackDashboard}
          style={{ background: 'none', border: 'none', color: MID, fontSize: 13, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 5, padding: '4px 8px', borderRadius: 5, fontWeight: 500 }}
          onMouseEnter={e => { e.currentTarget.style.background = BORD; e.currentTarget.style.color = DARK; }}
          onMouseLeave={e => { e.currentTarget.style.background = 'none'; e.currentTarget.style.color = MID; }}>
          <BackIco /> Tableau de bord
        </button>
        <span style={{ color: BORD, fontSize: 16 }}>›</span>
        <button onClick={onBackList}
          style={{ background: 'none', border: 'none', color: MID, fontSize: 13, cursor: 'pointer', padding: '4px 8px', borderRadius: 5, fontWeight: 500 }}
          onMouseEnter={e => { e.currentTarget.style.background = BORD; e.currentTarget.style.color = DARK; }}
          onMouseLeave={e => { e.currentTarget.style.background = 'none'; e.currentTarget.style.color = MID; }}>
          Licenciés
        </button>
        <span style={{ color: BORD, fontSize: 16 }}>›</span>
        <span style={{ fontWeight: 700, fontSize: 13, color: DARK }}>Dupont Martin</span>
      </div>

      <div style={{ padding: '28px 32px', maxWidth: 1060, margin: '0 auto' }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20, marginBottom: 20 }}>

          {/* ── Identité ── */}
          <div style={{ background: 'white', border: `1.5px solid ${BORD}`, borderRadius: 10, padding: 26 }}>
            <h3 style={{ fontWeight: 700, color: DARK, fontSize: 13, marginBottom: 18, paddingBottom: 12, borderBottom: `2px solid ${BORD}`, display: 'flex', alignItems: 'center', gap: 8 }}>
              <UserSm sz={14} col={RED} /> Identité
            </h3>
            <div style={{ display: 'grid', gridTemplateColumns: '130px 1fr', rowGap: 10, columnGap: 12, fontSize: 13 }}>
              {[
                ['Nom',        'DUPONT'],
                ['Prénom',     'Martin'],
                ['Naissance',  '12 mars 1994'],
                ['Catégorie',  'Senior'],
                ['Équipe',     'Équipe A'],
                ['Email',      'dupont.martin@mail.com'],
                ['Téléphone',  '06 12 34 56 78'],
              ].map(([k, v]) => (
                <React.Fragment key={k}>
                  <span style={{ color: MID }}>{k}</span>
                  <span style={{ color: DARK, fontWeight: 600 }}>{v}</span>
                </React.Fragment>
              ))}
            </div>
          </div>

          {/* ── Dossier ── */}
          <div style={{ background: 'white', border: `1.5px solid ${BORD}`, borderRadius: 10, padding: 26 }}>
            <h3 style={{ fontWeight: 700, color: DARK, fontSize: 13, marginBottom: 18, paddingBottom: 12, borderBottom: `2px solid ${BORD}` }}>
              Dossier
            </h3>
            {dossier.map((item, i) => (
              <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 11, marginBottom: 14, fontSize: 13 }}>
                {item.done ? <CheckSm sz={17} col="#16a34a" /> : <ClockSm sz={17} />}
                <span style={{ color: item.done ? DARK : MID, fontWeight: item.done ? 600 : 400, flex: 1 }}>{item.label}</span>
                {!item.done && (
                  <span style={{ fontSize: 11, color: '#d97706', background: '#fffbeb', padding: '2px 8px', borderRadius: 99, fontWeight: 700, flexShrink: 0 }}>En attente</span>
                )}
              </div>
            ))}
            <button
              onClick={() => setPaid(true)}
              disabled={paid}
              style={{ marginTop: 22, width: '100%', background: paid ? '#16a34a' : RED, color: 'white', border: 'none', padding: '12px', borderRadius: 7, fontSize: 14, fontWeight: 700, cursor: paid ? 'default' : 'pointer', transition: 'background .25s', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 9 }}>
              {paid
                ? <><CheckSm sz={15} col="white" /> Paiement confirmé</>
                : <><CardIco sz={15} /> Confirmer le paiement</>
              }
            </button>
          </div>
        </div>

        {/* ── Historique ── */}
        <div style={{ background: 'white', border: `1.5px solid ${BORD}`, borderRadius: 10, padding: 26 }}>
          <h3 style={{ fontWeight: 700, color: DARK, fontSize: 13, marginBottom: 18, paddingBottom: 12, borderBottom: `2px solid ${BORD}` }}>
            Historique des actions
          </h3>
          {history.map((h, i) => (
            <div key={i} style={{ display: 'grid', gridTemplateColumns: '170px 1fr 100px', gap: 12, paddingBottom: 12, borderBottom: i < history.length - 1 ? `1px solid ${BORD}` : 'none', marginBottom: i < history.length - 1 ? 12 : 0, fontSize: 13, alignItems: 'center' }}>
              <span style={{ color: MID }}>{h.date}</span>
              <span style={{ color: DARK }}>{h.action}</span>
              <span style={{ color: '#9ca3af', textAlign: 'right', fontSize: 12 }}>{h.who}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   ROOT — Tab bar + router
═══════════════════════════════════════════════════════════════ */
const TABS = [
  { id: 'hub',   label: '① Hub Admin' },
  { id: 'list',  label: '② Licenciés' },
  { id: 'form',  label: '③ Formulaire mobile' },
  { id: 'fiche', label: '④ Fiche licencié' },
];

function App() {
  const [tab, setTab] = useState(0);
  const [season, setSeason] = useState('2025/26');

  return (
    <div style={{ minHeight: '100vh' }}>
      {/* Tab navigation */}
      <div style={{ background: '#111', display: 'flex', alignItems: 'stretch', borderBottom: '3px solid #1d1d1d', overflowX: 'auto', flexShrink: 0 }}>
        <div style={{ padding: '0 20px', display: 'flex', alignItems: 'center', borderRight: '1px solid #2a2a2a', flexShrink: 0 }}>
          <span style={{ color: RED, fontWeight: 900, fontSize: 14, letterSpacing: 2 }}>COSYNC</span>
        </div>
        {TABS.map((t, i) => (
          <button key={t.id} onClick={() => setTab(i)}
            style={{ background: 'transparent', border: 'none', borderRight: '1px solid #222', color: i === tab ? 'white' : '#6b7280', padding: '13px 22px', fontSize: 12, fontWeight: i === tab ? 700 : 400, cursor: 'pointer', borderBottom: i === tab ? `3px solid ${RED}` : '3px solid transparent', marginBottom: -3, whiteSpace: 'nowrap', transition: 'color .15s' }}>
            {t.label}
          </button>
        ))}
        <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'flex-end', padding: '0 18px', flexShrink: 0 }}>
          <span style={{ color: '#2d2d2d', fontSize: 11, fontWeight: 600, letterSpacing: .5 }}>Maquettes v1 — Mai 2026</span>
        </div>
      </div>

      {/* Screens */}
      {tab === 0 && <HubAdmin season={season} setSeason={setSeason} />}
      {tab === 1 && <ListeLicencies season={season} setSeason={setSeason} onBack={() => setTab(0)} />}
      {tab === 2 && <FormulairePublic />}
      {tab === 3 && <FicheLicencie season={season} onBackDashboard={() => setTab(0)} onBackList={() => setTab(1)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
