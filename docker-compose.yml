services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cosync_php
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://${POSTGRES_USER:-cosync}:${POSTGRES_PASSWORD:-cosync}@database:5432/${POSTGRES_DB:-cosync}?serverVersion=16&charset=utf8
      MAILER_DSN: smtp://mailpit:1025
    depends_on:
      database:
        condition: service_healthy
    networks:
      - cosync

  nginx:
    image: nginx:1.25-alpine
    container_name: cosync_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - cosync

  database:
    image: postgres:16-alpine
    container_name: cosync_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cosync}
      POSTGRES_USER: ${POSTGRES_USER:-cosync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cosync}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-cosync}", "-U", "${POSTGRES_USER:-cosync}"]
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cosync

  cron:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cosync_cron
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql://${POSTGRES_USER:-cosync}:${POSTGRES_PASSWORD:-cosync}@database:5432/${POSTGRES_DB:-cosync}?serverVersion=16&charset=utf8
    entrypoint: ["/bin/sh", "/var/www/html/docker/php/cron-entrypoint.sh"]
    depends_on:
      database:
        condition: service_healthy
    networks:
      - cosync

  mailpit:
    image: axllent/mailpit:latest
    container_name: cosync_mail
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - cosync

volumes:
  db_data:

networks:
  cosync:
    driver: bridge
