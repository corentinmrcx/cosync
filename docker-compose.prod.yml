# Production — VPS avec Nginx Proxy Manager
#
# Prérequis sur le VPS :
#   1. Créer le réseau externe NPM une seule fois :
#      docker network create npm_network
#   2. Dans NPM, ajouter un Proxy Host vers http://cosync_nginx:80
#      (le container nginx est visible sur le réseau npm_network)
#
# Déploiement :
#   make prod-deploy

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    image: cosync-php:prod
    container_name: cosync_php
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - public_assets:/var/www/html/public
      - cosync_var_locks:/var/www/html/var/locks
    depends_on:
      database:
        condition: service_healthy
    networks:
      - cosync-internal

  nginx:
    image: nginx:1.25-alpine
    container_name: cosync_nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - public_assets:/var/www/html/public:ro
    depends_on:
      - php
    networks:
      - cosync-internal
      - npm-network

  database:
    image: postgres:16-alpine
    container_name: cosync_db
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cosync-internal

volumes:
  db_data:
  public_assets:
  cosync_var_locks:

networks:
  cosync-internal:
    driver: bridge
  npm-network:
    external: true
    name: npm_network
