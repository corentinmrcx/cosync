services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    image: cosync-php:prod
    container_name: cosync_php
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - public_assets:/var/www/html/public
      - cosync_var_locks:/var/www/html/var/locks
      - cosync_pdfs:/var/www/html/var/pdfs
    depends_on:
      database:
        condition: service_healthy
    networks:
      - cosync-internal

  # Reprise des uploads Drive en attente (PDF signés restés en local suite à une
  # panne de l'API Google). Partage le volume cosync_pdfs avec le conteneur php.
  cron:
    image: cosync-php:prod
    container_name: cosync_cron
    restart: unless-stopped
    env_file: .env.prod
    entrypoint: ["/bin/sh", "/var/www/html/docker/php/cron-entrypoint.sh"]
    volumes:
      - cosync_pdfs:/var/www/html/var/pdfs
    depends_on:
      php:
        condition: service_started
      database:
        condition: service_healthy
    networks:
      - cosync-internal

  nginx:
    image: nginx:1.25-alpine
    container_name: cosync_nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/maintenance.html:/usr/share/nginx/html/__maintenance.html:ro
      - public_assets:/var/www/html/public:ro
    depends_on:
      - php
    networks:
      - cosync-internal
      - npm-network

  database:
    image: postgres:16-alpine
    container_name: cosync_db
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cosync-internal

volumes:
  db_data:
  public_assets:
  cosync_var_locks:
  cosync_pdfs:

networks:
  cosync-internal:
    driver: bridge
  npm-network:
    external: true
    name: npm-network
