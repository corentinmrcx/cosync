memory_limit = 256M
upload_max_filesize = 20M
; Doit rester > upload_max_filesize, sinon un fichier de 20 Mo est rejeté :
; le POST transporte aussi le token CSRF et les autres champs du formulaire.
post_max_size = 24M
; L'import XLSX FootClubs dépasse les 60 s par défaut.
; À maintenir aligné avec fastcgi_read_timeout de nginx.prod.conf.
max_execution_time = 180
date.timezone = Europe/Paris

; OPcache agressif en production
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

; Désactiver l'affichage des erreurs en prod
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
