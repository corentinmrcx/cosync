server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    # En-têtes de sécurité posés sur toutes les réponses (`always` couvre aussi les
    # pages d'erreur). Le TLS est terminé en amont par Nginx Proxy Manager ; HSTS n'a
    # d'effet que sur les réponses réellement servies en HTTPS, ce qui est le cas en prod.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP : Alpine.js et Signature_pad s'appuient sur des handlers inline, d'où
    # 'unsafe-inline' sur script/style. 'unsafe-eval' est requis par Alpine (évaluation
    # d'expressions x-*). data: couvre les signatures encodées en base64.
    # Montserrat vient de Google Fonts (cf. templates/base.html.twig) : la feuille de
    # style est servie par fonts.googleapis.com et les .woff2 par fonts.gstatic.com,
    # deux origines distinctes à ouvrir séparément — sans quoi toute l'interface
    # retombe silencieusement sur la police système.
    # form-action est vérifié à *chaque saut* d'une soumission de formulaire, redirections
    # comprises : le POST vers /paiement/checkout part bien, mais la 302 vers la page de
    # paiement HelloAsso était bloquée dès qu'elle sortait de www.helloasso.com (HelloAsso
    # rebondit notamment sur le domaine nu helloasso.com). Chrome nomme alors l'URL du
    # formulaire, pas le saut fautif — d'où un message qui semble accuser 'self'. On ouvre
    # donc tout le domaine HelloAsso, domaine nu inclus (le joker ne le couvre pas).
    # Le bac à sable (helloasso-sandbox.com) est un domaine distinct, pas un sous-domaine :
    # il se déclare séparément. Les deux restent listés en permanence, sinon chaque bascule
    # entre HELLOASSO_API_BASE_URL réel et bac à sable recasse le bouton de paiement.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://helloasso.com https://*.helloasso.com https://helloasso-sandbox.com https://*.helloasso-sandbox.com" always;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        # Chemin hardcodé — évite les problèmes de $realpath_root
        # qui résoudrait le chemin du volume Docker côté Nginx
        # au lieu du chemin PHP interne.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        # L'import XLSX FootClubs (PhpSpreadsheet + N upserts Doctrine) dépasse
        # les 60 s par défaut. Aligné sur max_execution_time de php.prod.ini.
        fastcgi_read_timeout 180s;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    # Page de maintenance servie directement par Nginx quand le backend PHP est
    # injoignable (502/504) ou indisponible (503). Autonome, sans dépendance à PHP.
    error_page 502 503 504 /__maintenance.html;
    location = /__maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Cache navigateur pour les assets versionnés (Webpack Encore)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        # add_header ici remplace (n'hérite pas) les en-têtes du serveur : on répète
        # le nosniff, seul en-tête de sécurité pertinent pour un asset statique.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # > upload_max_filesize (20M) pour laisser la place aux autres champs du formulaire
    client_max_body_size 24M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
