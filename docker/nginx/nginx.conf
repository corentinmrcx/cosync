server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    # Le CSP est reproduit à l'identique depuis nginx.prod.conf — et uniquement lui : les
    # autres en-têtes de sécurité (HSTS, X-Frame-Options) n'ont aucun sens en HTTP local.
    # Sans cette ligne, une ressource externe ajoutée à un template ne rencontre jamais de
    # CSP avant la production, et c'est le licencié qui essuie le blocage. Deux pannes ont
    # été livrées comme ça : la police Montserrat, puis le bouton de paiement HelloAsso.
    # bin/check-csp.php refuse toute divergence entre les deux fichiers.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://helloasso.com https://*.helloasso.com https://helloasso-sandbox.com https://*.helloasso-sandbox.com" always;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    client_max_body_size 20M;

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
